name: selfcheck

on:
  push:
  workflow_dispatch:

jobs:
  verdicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clean pass (demo-math) - expect exit 0
        run: python3 verdictgate.py verdict examples/demo-math/results.csv --out-dir /tmp/vg

      - name: Pass with signals (web-login) - expect exit 0
        run: python3 verdictgate.py verdict examples/web-login/results.csv --out-dir /tmp/vg

      - name: Golden verdict - web-login
        run: |
          python3 verdictgate.py verdict examples/web-login/results.csv --out-dir /tmp/vg/gold-web
          diff /tmp/vg/gold-web/results.verdict.json examples/web-login/expected.verdict.json

      - name: Golden verdict - demo-math
        run: |
          python3 verdictgate.py verdict examples/demo-math/results.csv --out-dir /tmp/vg/gold-math
          diff /tmp/vg/gold-math/results.verdict.json examples/demo-math/expected.verdict.json

      - name: Hard gate fail (payment-critical) - expect exit 1
        run: |
          set +e
          python3 verdictgate.py verdict examples/payment-critical-fail/results.csv --out-dir /tmp/vg/fail
          code=$?
          set -e
          [ "$code" -eq 1 ]

      - name: No-op rejected pre-seed - expect exit 2
        run: |
          set +e
          python3 verdictgate.py verdict examples/noop-row/results.csv --out-dir /tmp/vg/noop
          code=$?
          set -e
          [ "$code" -eq 2 ]

      - name: B2 boundary matrix (small-N floors and band edges)
        run: |
          hdr="mutation_id,behavior,operator,risk_tier,expected,suite_result,observed,decision"
          mkb2() { # $1=file $2=B2-Y-count $3=pass-rows(survivors) $4=decision-or-empty
            echo "$hdr" > "$1"
            i=1
            while [ $i -le "$2" ]; do
              if [ $i -le "$3" ]; then res=pass; else res=fail; fi
              echo "M$i,flow $i,text_change,B2,Y,$res,,$4" >> "$1"
              i=$((i+1))
            done
          }
          expect() { # $1=file $2=expected-exit
            set +e; python3 verdictgate.py verdict "$1" --out-dir /tmp/vg/b >/dev/null 2>&1; code=$?; set -e
            [ "$code" -eq "$2" ] || { echo "FAIL: $1 expected exit $2 got $code"; exit 1; }
          }
          mkb2 /tmp/b2a.csv 3 0 "";       expect /tmp/b2a.csv 0
          mkb2 /tmp/b2b.csv 3 1 "fixed";  expect /tmp/b2b.csv 0
          mkb2 /tmp/b2c.csv 3 1 "";       expect /tmp/b2c.csv 1
          mkb2 /tmp/b2d.csv 3 2 "fixed";  expect /tmp/b2d.csv 1
          mkb2 /tmp/b2e.csv 20 1 "fixed"; expect /tmp/b2e.csv 0
          mkb2 /tmp/b2f.csv 20 2 "fixed"; expect /tmp/b2f.csv 1
          echo "B2 boundaries OK"

      - name: Mass-E signal example (B2, exit 0 with signal)
        run: |
          python3 verdictgate.py verdict examples/mass-e-signal/results.csv --out-dir /tmp/vg/me
          python3 verdictgate.py verdict examples/mass-e-signal/results.csv --out-dir /tmp/vg/me --json | python3 -c "import json,sys; v=json.load(sys.stdin); assert any('mass-equivalent' in s for s in v['tiers']['B2']['signals']), 'mass-E signal missing'"

      - name: Fail on unexercised (B0/B1 empty tiers)
        run: |
          set +e
          python3 verdictgate.py verdict examples/demo-math/results.csv --fail-on-unexercised --out-dir /tmp/vg/fu >/dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 1 ]
          python3 verdictgate.py verdict examples/demo-math/results.csv --fail-on-unexercised --out-dir /tmp/vg/fu --json | python3 -c "import json,sys; v=json.load(sys.stdin); assert v['unexercised_policy_applied'] is True"

      - name: Requirements cross-check (pass + laundering refused)
        run: |
          printf 'behavior_name,risk_tier,acceptance_criteria,description\nValid login shows welcome,B0,crit,desc\n' > /tmp/req-ok.csv
          printf 'mutation_id,behavior,operator,risk_tier,expected,suite_result,observed,decision\nM1,Valid login shows welcome,id_change,B0,Y,fail,,\n' > /tmp/req-t.csv
          python3 verdictgate.py verdict /tmp/req-t.csv --requirements /tmp/req-ok.csv --out-dir /tmp/vg/rk
          python3 verdictgate.py verdict /tmp/req-t.csv --requirements /tmp/req-ok.csv --out-dir /tmp/vg/rk --json | python3 -c "import json,sys; assert json.load(sys.stdin)['requirements_checked'] is True"
          printf 'mutation_id,behavior,operator,risk_tier,expected,suite_result,observed,decision\nM1,Valid login shows welcome,id_change,B2,Y,fail,,\n' > /tmp/req-bad.csv
          set +e; python3 verdictgate.py verdict /tmp/req-bad.csv --requirements /tmp/req-ok.csv --out-dir /tmp/vg/rb >/dev/null 2>&1; code=$?; set -e
          [ "$code" -eq 2 ]

      - name: Determinism - same input, byte-identical output
        run: |
          python3 verdictgate.py verdict examples/web-login/results.csv --out-dir /tmp/vg/d1
          python3 verdictgate.py verdict examples/web-login/results.csv --out-dir /tmp/vg/d2
          diff /tmp/vg/d1/results.verdict.json /tmp/vg/d2/results.verdict.json
          diff /tmp/vg/d1/results.verdict.md /tmp/vg/d2/results.verdict.md

      - name: Backward-compat shim - old-style CLI without subcommand
        run: |
          python3 verdictgate.py examples/demo-math/results.csv --out-dir /tmp/vg/shim
          diff /tmp/vg/shim/results.verdict.json /tmp/vg/gold-math/results.verdict.json

      - name: Profile - default ≡ no-profile (byte-identical modulo profile block)
        run: |
          python3 verdictgate.py verdict examples/demo-math/results.csv --profile default --out-dir /tmp/vg/prof-default
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/vg/prof-default/results.verdict.json'))
          b=json.load(open('/tmp/vg/gold-math/results.verdict.json'))
          a.pop('profile'); b.pop('profile')
          assert a==b, "default profile must match no-profile run"
          assert a['scorer_version']=='0.3.0'
          PY

      - name: Profile - qeaverest stamp present
        run: |
          python3 verdictgate.py verdict examples/web-login/results.csv --profile qeaverest --out-dir /tmp/vg/prof-qe
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/vg/prof-qe/results.verdict.json'))
          assert v['profile']['name']=='qeaverest'
          assert v['profile']['sha256'] is not None
          assert 'profile=qeaverest' in open('/tmp/vg/prof-qe/results.verdict.md').read()
          PY

      - name: Profile - precedence (CLI flag wins, stamp shows both)
        run: |
          python3 verdictgate.py verdict examples/demo-math/results.csv --profile qeaverest --b2-band-pct 99 --out-dir /tmp/vg/prof-prec
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/vg/prof-prec/results.verdict.json'))
          assert v['b2_band_pct']==99
          assert v['profile']['name']=='qeaverest'
          PY

      - name: Profile - unknown key -> exit 2
        run: |
          printf '{"name":"x","foo":1}' > /tmp/vg/badprof.json
          set +e
          python3 verdictgate.py verdict examples/demo-math/results.csv --profile /tmp/vg/badprof.json --out-dir /tmp/vg/badprof >/dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 2 ]

      - name: Profile - out-of-range value -> exit 2
        run: |
          printf '{"name":"x","b2_band_pct":101}' > /tmp/vg/rangeprof.json
          set +e
          python3 verdictgate.py verdict examples/demo-math/results.csv --profile /tmp/vg/rangeprof.json --out-dir /tmp/vg/rangeprof >/dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 2 ]

      - name: Profile - behavior diff (B1 observed budget 0% vs 20%) and B2 score target
        run: |
          python3 verdictgate.py verdict examples/web-login/results.csv --out-dir /tmp/vg/beh-none
          python3 verdictgate.py verdict examples/web-login/results.csv --profile qeaverest --out-dir /tmp/vg/beh-qe
          python3 - <<'PY'
          import json
          n=json.load(open('/tmp/vg/beh-none/results.verdict.json'))
          q=json.load(open('/tmp/vg/beh-qe/results.verdict.json'))
          nB1=n['tiers']['B1']['signals']; qB1=q['tiers']['B1']['signals']
          assert any('exceeds budget 20%' in s for s in nB1), nB1
          assert any('exceeds budget 0%' in s for s in qB1), qB1
          # B2 score target: 70% synthetic must signal under default (90) and not under qeaverest (60)
          import subprocess, os
          os.makedirs('/tmp/vg/synth', exist_ok=True)
          with open('/tmp/vg/synth/b2.csv','w') as f:
              f.write('mutation_id,behavior,operator,risk_tier,expected,suite_result,observed,decision\n')
              for i in range(1,8): f.write(f'M{i},f{i},text_change,B2,Y,fail,,\n')
              for i in range(8,11): f.write(f'M{i},f{i},text_change,B2,Y,pass,,open\n')
          subprocess.run(['python3','verdictgate.py','verdict','/tmp/vg/synth/b2.csv','--out-dir','/tmp/vg/synth/none'])
          subprocess.run(['python3','verdictgate.py','verdict','/tmp/vg/synth/b2.csv','--profile','qeaverest','--out-dir','/tmp/vg/synth/qe'])
          nd=json.load(open('/tmp/vg/synth/none/b2.verdict.json'))
          qd=json.load(open('/tmp/vg/synth/qe/b2.verdict.json'))
          assert any('below target 90%' in s for s in nd['tiers']['B2']['signals']), nd['tiers']['B2']['signals']
          assert not any('below target' in s for s in qd['tiers']['B2']['signals']), qd['tiers']['B2']['signals']
          print('behavior diff OK')
          PY

      - name: Unexercised - excluded from denominator, visible, NOT EXERCISED
        run: |
          mkdir -p /tmp/vg/unex
          printf 'mutation_id,behavior,operator,risk_tier,expected,suite_result,observed,decision\nM1,b,op,B1,Y,unexercised,,\n' > /tmp/vg/unex/a.csv
          python3 verdictgate.py verdict /tmp/vg/unex/a.csv --out-dir /tmp/vg/unex/o
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/vg/unex/o/a.verdict.json'))
          assert v['tiers']['B1']['seeded']==0, v['tiers']['B1']
          assert v['tiers']['B1']['unexercised']==1, v['tiers']['B1']
          assert v['tiers']['B1']['gate']=='NOT EXERCISED', v['tiers']['B1']['gate']
          assert v['totals']['unexercised']==1, v['totals']
          assert len(v['unexercised_rows'])==1, v['unexercised_rows']
          assert any('never executed' in s for s in v['tiers']['B1']['signals']), v['tiers']['B1']['signals']
          PY

      - name: Unexercised - --fail-on-unexercised blocks B0/B1
        run: |
          set +e
          python3 verdictgate.py verdict /tmp/vg/unex/a.csv --fail-on-unexercised --out-dir /tmp/vg/unex/f >/dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 1 ]

      - name: Unexercised - invalid combinations exit 2
        run: |
          printf 'mutation_id,behavior,operator,risk_tier,expected,suite_result,observed,decision\nM1,b,op,B1,N,unexercised,,\n' > /tmp/vg/unex/bad1.csv
          set +e
          python3 verdictgate.py verdict /tmp/vg/unex/bad1.csv --out-dir /tmp/vg/unex/b1 >/dev/null 2>&1
          c1=$?
          set -e
          [ "$c1" -eq 2 ]
          printf 'mutation_id,behavior,operator,risk_tier,expected,suite_result,observed,decision\nM1,b,op,B1,Y,unexercised,,open\n' > /tmp/vg/unex/bad2.csv
          set +e
          python3 verdictgate.py verdict /tmp/vg/unex/bad2.csv --out-dir /tmp/vg/unex/b2 >/dev/null 2>&1
          c2=$?
          set -e
          [ "$c2" -eq 2 ]

      - name: Import stamp - no-coverage directive reaches verdict
        run: |
          mkdir -p /tmp/vg/imp
          printf '# import: source=StrykerJS 8.7.1 schemaVersion=1.0\n# import: report_sha256=deadbeef\n# import: no-coverage=survived\nmutation_id,behavior,operator,risk_tier,expected,suite_result,observed,decision\nM1,b,op,B1,Y,pass,,\n' > /tmp/vg/imp/a.csv
          python3 verdictgate.py verdict /tmp/vg/imp/a.csv --out-dir /tmp/vg/imp/o
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/vg/imp/o/a.verdict.json'))
          assert v['import']['no_coverage']=='survived', v.get('import')
          assert 'import-no-coverage=survived' in open('/tmp/vg/imp/o/a.verdict.md').read()
          PY

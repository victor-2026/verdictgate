name: verdict

on:
  pull_request_target:
    paths:
      - '**/results.csv'
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-latest
    steps:
      # Trusted code only: base branch. The PR's CSV is data, fetched separately
      # and parsed by the deterministic, stdlib-only verdictgate.py (no network,
      # no eval) - safe to run against untrusted fork-PR input.
      - name: Checkout base (trusted code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch PR head and run verdicts
        id: run
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "workflow_dispatch without PR - nothing to do"
            mkdir -p /tmp/vg
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            printf '<!-- verdictgate -->\nManual dispatch: no PR context.\n' > /tmp/vg/comment.md
            echo "comment_file=/tmp/vg/comment.md" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/vg
          git fetch --no-tags origin pull/$PR_NUMBER/head:pr-head
          changed=$(git diff --name-only origin/$BASE_REF...pr-head | grep -E '(^|/)results\.csv$' || true)
          if [ -z "$changed" ]; then
            echo "no changed results.csv"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            printf '<!-- verdictgate -->\nNo changed results.csv in this PR.\n' > /tmp/vg/comment.md
            echo "comment_file=/tmp/vg/comment.md" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/vg
          overall=0
          comment_file=/tmp/vg/comment.md
          printf '<!-- verdictgate -->\n' > "$comment_file"
          for f in $changed; do
            safe=$(echo "$f" | tr '/' '_')
            git show "pr-head:$f" > "/tmp/vg/$safe"
            outdir="/tmp/vg/out_$safe"
            mkdir -p "$outdir"
            set +e
            python3 verdictgate.py verdict "/tmp/vg/$safe" --out-dir "$outdir" >"/tmp/vg/$safe.log" 2>&1
            code=$?
            set -e
            {
              echo "### \`$f\` (exit $code)"
              echo ""
              if ls "$outdir"/*.verdict.md >/dev/null 2>&1; then
                cat "$outdir"/*.verdict.md
              else
                echo '```'
                cat "/tmp/vg/$safe.log"
                echo '```'
              fi
              echo ""
            } >> "$comment_file"
            if [ "$code" -gt "$overall" ]; then overall=$code; fi
          done
          echo "exit_code=$overall" >> "$GITHUB_OUTPUT"
          echo "comment_file=$comment_file" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post or update PR comment
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- verdictgate -->';
            const body = fs.readFileSync('${{ steps.run.outputs.comment_file }}', 'utf8');
            const { owner, repo } = context.repo;
            const pr = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: pr });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }

      - name: Fail if verdict failed
        if: steps.run.outputs.exit_code != '0'
        run: exit ${{ steps.run.outputs.exit_code }}
